#############################
# Doctor Assistant LLM — free providers (auto picks first available)
# Groq (recommended): free at console.groq.com — set GROQ_API_KEY or groq.api-key below
# OpenRouter: free models at openrouter.ai — set OPENROUTER_API_KEY
# Ollama: local, no key — install from ollama.com and run `ollama pull llama3.2`
#############################
doctor-assistant.llm.provider=auto
doctor-assistant.llm.base-url=https://api.groq.com/openai/v1
doctor-assistant.llm.default-model=llama-3.3-70b-versatile
